name: Build, test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Failures in the steps below are also reported as annotations (the
      # "Annotations" box on the run page) so they're readable at a glance.
      - name: Install dependencies
        run: |
          set -o pipefail
          if [ -f package-lock.json ]; then cmd="npm ci"; else cmd="npm install"; fi
          $cmd --no-audit --no-fund 2>&1 | tee install.log || {
            echo "::error title=Install failed::$(tail -n 40 install.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          }

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        timeout-minutes: 10
        run: npm test -- --reporter=default --reporter=github-actions

      - name: Build site
        run: |
          set -o pipefail
          npx vite build 2>&1 | tee build.log || {
            echo "::error title=Build failed::$(tail -n 40 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          }

      - name: Install browser for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        env:
          # Set to "1" to attach small screenshots as annotations for review.
          SMOKE_SCREENSHOTS: "0"
          SMOKE_SHOW: "toolmenu,sketch,drawing"
        run: npm run smoke

      - name: Attach screenshot 1
        if: always()
        run: node scripts/emit-screenshot.mjs 1
      - name: Attach screenshot 2
        if: always()
        run: node scripts/emit-screenshot.mjs 2
      - name: Attach screenshot 3
        if: always()
        run: node scripts/emit-screenshot.mjs 3
      - name: Attach screenshot 4
        if: always()
        run: node scripts/emit-screenshot.mjs 4
      - name: Attach screenshot 5
        if: always()
        run: node scripts/emit-screenshot.mjs 5
      - name: Attach screenshot 6
        if: always()
        run: node scripts/emit-screenshot.mjs 6
      - name: Attach screenshot 7
        if: always()
        run: node scripts/emit-screenshot.mjs 7
      - name: Attach screenshot 8
        if: always()
        run: node scripts/emit-screenshot.mjs 8
      - name: Attach screenshot 9
        if: always()
        run: node scripts/emit-screenshot.mjs 9
      - name: Attach screenshot 10
        if: always()
        run: node scripts/emit-screenshot.mjs 10
      - name: Attach screenshot 11
        if: always()
        run: node scripts/emit-screenshot.mjs 11
      - name: Attach screenshot 12
        if: always()
        run: node scripts/emit-screenshot.mjs 12
      - name: Attach screenshot 13
        if: always()
        run: node scripts/emit-screenshot.mjs 13
      - name: Attach screenshot 14
        if: always()
        run: node scripts/emit-screenshot.mjs 14
      - name: Attach screenshot 15
        if: always()
        run: node scripts/emit-screenshot.mjs 15
      - name: Attach screenshot 16
        if: always()
        run: node scripts/emit-screenshot.mjs 16

      - name: Keep the built site (for previewing pull requests)
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            dist
            package-lock.json
          retention-days: 7

      - name: Prepare GitHub Pages upload
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
