name: Build, test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Failures in the steps below are also reported as annotations (the
      # "Annotations" box on the run page) so they're readable at a glance.
      - name: Install dependencies
        run: |
          set -o pipefail
          if [ -f package-lock.json ]; then cmd="npm ci"; else cmd="npm install"; fi
          $cmd --no-audit --no-fund 2>&1 | tee install.log || {
            echo "::error title=Install failed::$(tail -n 40 install.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          }

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --reporter=default --reporter=github-actions

      - name: Build site
        run: |
          set -o pipefail
          npx vite build 2>&1 | tee build.log || {
            echo "::error title=Build failed::$(tail -n 40 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          }

      - name: Keep the built site (for previewing pull requests)
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            dist
            package-lock.json
          retention-days: 7

      - name: Prepare GitHub Pages upload
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
