name: Build, test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # Pinned so the machine only changes when we choose (ubuntu-latest moves to
    # Ubuntu 26 from October 2026). Move to the next version deliberately.
    runs-on: ubuntu-24.04
    env:
      # The site lives at https://gm7dha.github.io/<repo name>/, so the build and the
      # smoke test use the repository's name as the base path. Renaming the repo
      # needs no code change: run this workflow again (Actions › Run workflow).
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Failures in the steps below are also reported as annotations (the
      # "Annotations" box on the run page) so they're readable at a glance.
      - name: Install dependencies
        run: |
          set -o pipefail
          if [ -f package-lock.json ]; then cmd="npm ci"; else cmd="npm install"; fi
          $cmd --no-audit --no-fund 2>&1 | tee install.log || {
            echo "::error title=Install failed::$(tail -n 40 install.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          }

      - name: Type check
        run: npm run typecheck

      # Failures (including a test process that crashed or ran out of memory)
      # become annotations, and a notice sums up time and memory per file:
      # see tests/support/ciReporter.ts.
      - name: Run tests
        id: tests
        timeout-minutes: 15
        run: npm test -- --reporter=default --reporter=./tests/support/ciReporter.ts

      - name: Report memory problems
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          free -m
          # Did the system stop a process for using too much memory?
          oom="$(sudo dmesg 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -n 5 || true)"
          if [ -n "$oom" ]; then
            echo "::error title=Out of memory::$(echo "$oom" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          else
            echo "::notice title=Memory::No out-of-memory kills recorded. $(free -m | awk '/^Mem:/ {print $2 " MB in total, " $7 " MB available now."}')"
          fi

      - name: Build site
        run: |
          set -o pipefail
          npx vite build 2>&1 | tee build.log || {
            echo "::error title=Build failed::$(tail -n 40 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          }

      - name: Report the versions of the Claude extension's tools
        run: |
          echo "::notice title=Tool versions::sdk $(node -p "require('./node_modules/@modelcontextprotocol/sdk/package.json').version") zod $(node -p "require('./node_modules/zod/package.json').version") esbuild $(node -p "require('./node_modules/esbuild/package.json').version") mcpb $(npx --no-install mcpb --version 2>&1 | tail -1)"

      # JuraCAD for Claude: the extension for the Claude desktop app (an .mcpb
      # bundle), built from src/mcp and put on the site for download.
      - name: Build the Claude extension
        run: |
          set -o pipefail
          {
            node scripts/build-claude-extension.mjs &&
            npx --no-install mcpb validate build/claude-extension/manifest.json &&
            npx --no-install mcpb pack build/claude-extension dist/juracad-claude.mcpb
          } 2>&1 | tee extension.log || {
            echo "::error title=Claude extension build failed::$(tail -n 40 extension.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          }

      - name: Check the Claude extension (unpack, start it, build a part over MCP)
        timeout-minutes: 5
        run: node scripts/check-claude-extension.mjs dist/juracad-claude.mcpb

      - name: Install browser for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        env:
          # Set to "1" to attach small screenshots as annotations for review.
          SMOKE_SCREENSHOTS: "0"
          SMOKE_SHOW: "shortened"
        run: npm run smoke

      - name: Attach screenshot 1
        if: always()
        run: node scripts/emit-screenshot.mjs 1
      - name: Attach screenshot 2
        if: always()
        run: node scripts/emit-screenshot.mjs 2
      - name: Attach screenshot 3
        if: always()
        run: node scripts/emit-screenshot.mjs 3
      - name: Attach screenshot 4
        if: always()
        run: node scripts/emit-screenshot.mjs 4
      - name: Attach screenshot 5
        if: always()
        run: node scripts/emit-screenshot.mjs 5
      - name: Attach screenshot 6
        if: always()
        run: node scripts/emit-screenshot.mjs 6
      - name: Attach screenshot 7
        if: always()
        run: node scripts/emit-screenshot.mjs 7
      - name: Attach screenshot 8
        if: always()
        run: node scripts/emit-screenshot.mjs 8
      - name: Attach screenshot 9
        if: always()
        run: node scripts/emit-screenshot.mjs 9
      - name: Attach screenshot 10
        if: always()
        run: node scripts/emit-screenshot.mjs 10
      - name: Attach screenshot 11
        if: always()
        run: node scripts/emit-screenshot.mjs 11
      - name: Attach screenshot 12
        if: always()
        run: node scripts/emit-screenshot.mjs 12
      - name: Attach screenshot 13
        if: always()
        run: node scripts/emit-screenshot.mjs 13
      - name: Attach screenshot 14
        if: always()
        run: node scripts/emit-screenshot.mjs 14
      - name: Attach screenshot 15
        if: always()
        run: node scripts/emit-screenshot.mjs 15
      - name: Attach screenshot 16
        if: always()
        run: node scripts/emit-screenshot.mjs 16

      - name: Keep the built site (for previewing pull requests)
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            dist
            package-lock.json
          retention-days: 7

      - name: Prepare GitHub Pages upload
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
